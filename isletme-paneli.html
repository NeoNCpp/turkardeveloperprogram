<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İşletme Paneli</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060a10; --bg2:rgba(8,16,26,.55); --card:rgba(150,210,255,.085); --card2:rgba(150,210,255,.15); --line:rgba(180,225,255,.18);
  --text:#eaf4fc; --muted:#8a9cad; --gold:#9fd8ff; --gold2:#d4efff; --glass:blur(16px) saturate(140%);
  --ok:#5fbf8f; --red:#e06b6b; --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:rgba(170,220,255,.2);border-radius:3px}

.app{display:grid;grid-template-columns:260px 1fr;height:100vh}
/* SIDEBAR */
.side{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:22px 20px 18px;border-bottom:1px solid var(--line)}
.brand h1{font-family:'Playfair Display',serif;font-size:20px;color:var(--gold);letter-spacing:.3px}
.brand p{color:var(--muted);font-size:12px;margin-top:3px}
.biz-list{flex:1;overflow:auto;padding:12px}
.biz{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:11px;margin-bottom:4px;transition:.15s;position:relative}
.biz:hover{background:var(--card)}
.biz.active{background:var(--card2);box-shadow:inset 0 0 0 1px var(--line)}
.biz.active::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--gold)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.biz .nm{flex:1;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.biz .ct{font-size:11px;color:var(--muted);background:var(--bg);padding:2px 7px;border-radius:20px}
.side-foot{padding:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:10px;font-weight:600;transition:.15s;white-space:nowrap}
.btn-gold{background:linear-gradient(135deg,#d4efff,#86c8f2);color:#06121c}
.btn-gold:hover{filter:brightness(1.08)}
.btn-ghost{border:1px solid var(--line);color:var(--muted)}
.btn-ghost:hover{color:var(--text);border-color:rgba(170,220,255,.28)}
.btn-sm{padding:7px 11px;font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* MAIN */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:14px;padding:18px 28px;border-bottom:1px solid var(--line)}
.top .title{flex:1;min-width:0}
.top h2{font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{color:var(--muted);font-size:12px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:hover{color:var(--text);border-color:rgba(170,220,255,.28)}
.tabs{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:3px;position:relative}
.tabs button{position:relative;z-index:1;padding:8px 18px;font-weight:600;color:var(--muted);transition:color .2s}
.tabs button.on{color:#06121c}
.tabs .pill{position:absolute;top:3px;bottom:3px;border-radius:8px;background:var(--gold);transition:.3s cubic-bezier(.4,0,.2,1)}
.views{flex:1;overflow:hidden;position:relative}
.slider{display:flex;width:200%;height:100%;transition:transform .4s cubic-bezier(.4,0,.2,1)}
.view{width:50%;height:100%;overflow:auto;padding:24px 28px 80px}

/* PROGRAM */
.datebar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.datebar .d{font-size:17px;font-weight:600;min-width:0}
.datebar .d span{color:var(--muted);font-weight:400;font-size:13px;margin-left:6px}
.datebar .sp{flex:1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:22px}
.wd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;transition:.15s}
.wd:hover{border-color:rgba(170,220,255,.28)}
.wd .a{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.wd .b{font-size:18px;font-weight:700;margin:3px 0}
.wd .c{height:5px;display:flex;justify-content:center;gap:3px}
.wd .c i{width:5px;height:5px;border-radius:50%;background:var(--gold);opacity:.8}
.wd.today .b{color:var(--gold)}
.wd.sel{background:var(--card2);border-color:var(--gold)}
.progress{display:flex;align-items:center;gap:12px;margin-bottom:16px;color:var(--muted);font-size:12px}
.bar{flex:1;height:6px;background:var(--card);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .4s}
.items{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:auto 64px 1fr auto;gap:14px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;transition:.15s;animation:in .25s ease}
.item:hover{border-color:rgba(170,220,255,.24)}
.item.done{opacity:.5}
.item.done .it-t{text-decoration:line-through}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid rgba(170,220,255,.28);display:grid;place-items:center;margin-top:1px;transition:.15s}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk svg{opacity:0}.chk.on svg{opacity:1}
.it-time{font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;padding-top:2px}
.it-time small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.it-t{font-weight:600;font-size:15px;word-break:break-word}
.it-n{color:var(--muted);font-size:13px;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--bg);color:var(--gold2);border:1px solid var(--line);margin-top:7px}
.it-act{display:flex;gap:4px;opacity:0;transition:.15s}
.item:hover .it-act{opacity:1}
.mini{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.mini:hover{background:var(--bg);color:var(--text)}
.mini.del:hover{color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:50px 20px;border:1px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}

/* NOTES */
.notebar{display:flex;gap:10px;margin-bottom:20px}
.notebar input{max-width:360px}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;align-items:start;margin-bottom:14px}
.note{break-inside:avoid;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;transition:.15s;position:relative;border-top:3px solid var(--nc,var(--line));animation:in .25s ease}
.note:hover{border-color:rgba(170,220,255,.24);border-top-color:var(--nc,rgba(170,220,255,.24));transform:translateY(-2px)}
.note h4{font-size:15px;margin-bottom:6px;padding-right:22px;word-break:break-word}
.note p{color:var(--muted);font-size:13px;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
.note .meta{font-size:11px;color:#6b7d8e;margin-top:10px}
.note .pin{position:absolute;top:14px;right:14px;color:var(--gold)}
.sec-t{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:4px 0 10px}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.show{display:flex;animation:fade .2s}
.modal{background:var(--card);border:1px solid var(--line);border-radius:18px;width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:22px;animation:pop .25s cubic-bezier(.4,0,.2,1)}
.modal h3{font-size:17px;margin-bottom:16px}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.m-act{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.m-act .l{margin-right:auto}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:28px;height:28px;border-radius:50%;border:2px solid transparent}
.colors button.on{border-color:#fff}
.note-ed textarea{min-height:240px;resize:vertical;line-height:1.55}
.note-ed .tt{font-size:17px;font-weight:600;border:0;background:none;padding:4px 0;margin-bottom:8px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--card2);border:1px solid var(--line);padding:11px 18px;border-radius:12px;opacity:0;transition:.3s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fab{display:none}
.mbiz{display:none}
.scrim{display:none}

/* BUZ CAM */
.side,.wd,.item,.note,.box,.modal,.tabs,.stat,.empty,.top{backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
.item,.note,.box,.wd{box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 8px 24px rgba(0,0,0,.25)}
.modal{background:rgba(16,28,42,.72)}
.side{background:rgba(8,14,22,.6)}
.top{background:rgba(6,10,16,.35)}
input,textarea,select{background:rgba(8,16,26,.6)}
select option{background:#0c1622}
/* ÖZEL RENK + SAĞ TIK */
.colors{align-items:center}
.cpick{position:relative;width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;background:var(--cv,conic-gradient(#f66,#fd6,#6f9,#6df,#86f,#f6d,#f66));overflow:hidden;flex:none}
.cpick.on{border-color:#fff}
.cpick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;padding:0;border:0}
.chex{width:96px!important;padding:6px 10px!important;font-size:13px;font-family:ui-monospace,Menlo,monospace;text-transform:uppercase}
.chex.bad{border-color:var(--red)!important}
.ctx{position:fixed;z-index:80;min-width:190px;padding:6px;border-radius:12px;background:rgba(14,26,40,.85);border:1px solid var(--line);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);box-shadow:0 16px 40px rgba(0,0,0,.5);display:none}
.ctx.show{display:block;animation:pop .14s ease}
.ctx-h{display:flex;align-items:center;gap:8px;padding:8px 10px 9px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;text-align:left;font-size:13px}
.ctx button:hover{background:var(--card2)}
.ctx button.d{color:var(--red)}
.ctx button.d:hover{background:rgba(224,107,107,.12)}
.ctx-sep{height:1px;background:var(--line);margin:4px 0}
.biz{-webkit-touch-callout:none;user-select:none}
/* HAREKETLİ ARKA PLAN */
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;background:#03060c}
.bgfx::before,.bgfx::after{content:'';position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;border-radius:50%;will-change:transform;filter:blur(70px)}
.bgfx::before{
  background:conic-gradient(from 0deg,#0b1d45,#02040a 14%,#2f6f9e 28%,#0d2756 42%,#010309 56%,#4a8fbf 70%,#0a1a40 84%,#0b1d45);
  opacity:.34;animation:spin 46s linear infinite}
.bgfx::after{
  width:120vmax;height:120vmax;
  background:conic-gradient(from 180deg,#02040a,#163a6e 20%,#020509 40%,#3a7fb0 60%,#081634 80%,#02040a);
  opacity:.2;mix-blend-mode:screen;animation:spin 64s linear infinite reverse}
@keyframes spin{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.bgfx::before,.bgfx::after{animation:none;transform:translate(-50%,-50%)}}
/* DESKTOP DÜZEN */
.top{padding-left:max(28px,calc((100% - 1240px)/2));padding-right:max(28px,calc((100% - 1240px)/2))}
.view>*{max-width:1240px;margin-left:auto;margin-right:auto}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.paside{display:flex;flex-direction:column;gap:14px;position:sticky;top:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.box h5{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);font-weight:600;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:12px 10px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.stat.g b{color:var(--gold)}.stat.o b{color:var(--ok)}
.next{margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.next b{display:block;color:var(--text);font-size:14px;margin-top:4px}
.next b em{font-style:normal;color:var(--gold);margin-right:6px}
.up{display:flex;flex-direction:column;gap:2px}
.up-r{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:baseline;padding:8px;border-radius:9px;text-align:left;width:100%}
.up-r:hover{background:var(--bg2)}
.up-r .ud{font-size:12px;color:var(--gold);font-weight:600}
.up-r .ut{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up-r .ut small{color:var(--muted);margin-left:6px}
.muted{color:var(--muted);font-size:13px}
.pn{padding:9px 10px;border-radius:9px;border-left:3px solid var(--nc,var(--line));background:var(--bg2);margin-bottom:6px;cursor:pointer;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn:hover{background:var(--card2)}

@media(max-width:1180px){
  .pgrid{grid-template-columns:1fr}
  .paside{position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
}
@media(min-width:821px) and (max-width:1100px){
  .app{grid-template-columns:220px 1fr}
  .top{padding-left:22px;padding-right:22px}
  .view{padding-left:22px;padding-right:22px}
}
@media(hover:none){.it-act{opacity:1}}

@keyframes in{from{opacity:0;transform:translateY(6px)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.96)}}

/* MOBILE */
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:280px;z-index:40;transform:translateX(-100%);transition:.3s}
  .side.open{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.6)}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:39;display:none}
  .scrim.show{display:block}
  .mbiz{display:grid}
  .top{padding:14px 16px;gap:10px;flex-wrap:wrap}
  .top .tabs{order:3;width:100%}
  .tabs button{flex:1}
  .top-add{display:none}
  .view{padding:16px 16px 100px}
  .week{gap:5px}
  .wd{padding:8px 2px}.wd .b{font-size:15px}
  .item{grid-template-columns:auto 52px 1fr;padding:12px}
  .it-act{grid-column:1/-1;opacity:1;justify-content:flex-end;margin-top:-6px}
  .notebar input{max-width:none}
  .fab{display:grid;position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#d4efff,#86c8f2);color:#06121c;place-items:center;z-index:30;box-shadow:0 10px 30px rgba(134,200,242,.3)}
}
</style>
</head>
<body>
<div class="bgfx" aria-hidden="true"></div>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><h1>İşletme Paneli</h1><p>Türkar Developer</p></div>
    <div class="biz-list" id="bizList"></div>
    <div class="side-foot">
      <button class="btn btn-gold" onclick="openBiz()">+ İşletme Ekle</button>
      <div class="row2">
        <button class="btn btn-ghost btn-sm" onclick="exportData()">Yedek Al</button>
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('imp').click()">Geri Yükle</button>
      </div>
      <input type="file" id="imp" accept=".json" hidden onchange="importData(this)">
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <button class="icon-btn mbiz" onclick="toggleSide(true)" aria-label="İşletmeler">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="title">
        <h2 id="bizTitle"></h2>
        <small id="bizSub"></small>
      </div>
      <button class="icon-btn" id="editBizBtn" onclick="openBiz(state.active)" aria-label="İşletmeyi düzenle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
      </button>
      <div class="tabs" id="tabs">
        <div class="pill" id="pill"></div>
        <button class="on" onclick="setTab(0)">Program</button>
        <button onclick="setTab(1)">Notlar</button>
      </div>
      <button class="btn btn-gold top-add" onclick="addCurrent()">+ Ekle</button>
    </div>

    <div class="views">
      <div class="slider" id="slider">
        <section class="view" id="vProgram"></section>
        <section class="view" id="vNotes"></section>
      </div>
    </div>
  </main>
</div>
<div class="scrim" id="scrim" onclick="toggleSide(false)"></div>
<button class="fab" onclick="addCurrent()" aria-label="Ekle"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></button>

<!-- İşletme modal -->
<div class="ov" id="mBiz"><div class="modal">
  <h3 id="mBizT">İşletme</h3>
  <div class="f"><label>İşletme adı</label><input id="bName" placeholder="Örn. Kahve Durağı"></div>
  <div class="f"><label>Renk</label><div class="colors" id="bColors"></div></div>
  <div class="m-act">
    <button class="btn btn-ghost l" id="bDel" style="color:var(--red)" onclick="delBiz()">Sil</button>
    <button class="btn btn-ghost" onclick="closeM('mBiz')">Vazgeç</button>
    <button class="btn btn-gold" onclick="saveBiz()">Kaydet</button>
  </div>
</div></div>

<!-- Program modal -->
<div class="ov" id="mEv"><div class="modal">
  <h3 id="mEvT">Programa Ekle</h3>
  <div class="f"><label>Başlık</label><input id="eTitle" placeholder="Örn. Story paylaşımı"></div>
  <div class="row2">
    <div class="f"><label>Başlangıç</label><input type="time" id="eStart"></div>
    <div class="f"><label>Bitiş (opsiyonel)</label><input type="time" id="eEnd"></div>
  </div>
  <div class="row2">
    <div class="f"><label>Tarih</label><input type="date" id="eDate"></div>
    <div class="f"><label>Etiket</label>
      <select id="eTag"><option value="">—</option><option>Paylaşım</option><option>Çekim</option><option>Toplantı</option><option>Tasarım</option><option>Reklam</option><option>Ödeme</option><option>Diğer</option></select>
    </div>
  </div>
  <div class="f"><label>Not</label><textarea id="eNote" rows="3" placeholder="Detaylar…"></textarea></div>
  <div class="m-act">
    <button class="btn btn-ghost l" id="eDel" style="color:var(--red)" onclick="delEv()">Sil</button>
    <button class="btn btn-ghost" onclick="closeM('mEv')">Vazgeç</button>
    <button class="btn btn-gold" onclick="saveEv()">Kaydet</button>
  </div>
</div></div>

<!-- Not modal -->
<div class="ov" id="mNote"><div class="modal note-ed">
  <input class="tt" id="nTitle" placeholder="Başlık">
  <textarea id="nBody" placeholder="Notunu yaz…"></textarea>
  <div class="f" style="margin-top:12px"><label>Renk</label><div class="colors" id="nColors"></div></div>
  <div class="m-act">
    <button class="btn btn-ghost l" id="nDel" style="color:var(--red)" onclick="delNote()">Sil</button>
    <button class="btn btn-ghost" id="nPin" onclick="togglePinM()">Sabitle</button>
    <button class="btn btn-gold" onclick="saveNote()">Kaydet</button>
  </div>
</div></div>

<!-- Onay modal -->
<div class="ov" id="mConf" style="z-index:70"><div class="modal" style="max-width:380px">
  <h3>Emin misin?</h3>
  <p id="cMsg" style="color:var(--muted);line-height:1.5"></p>
  <div class="m-act">
    <button class="btn btn-ghost" onclick="closeM('mConf')">Vazgeç</button>
    <button class="btn" id="cYes" style="background:var(--red);color:#fff">Sil</button>
  </div>
</div></div>

<div class="ctx" id="ctx">
  <div class="ctx-h" id="ctxName"></div>
  <button onclick="ctxDo('open')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Aç</button>
  <button onclick="ctxDo('edit')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>Düzenle / Renk</button>
  <div class="ctx-sep"></div>
  <button class="d" onclick="ctxDo('del')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>Sil</button>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY='isletme_paneli_v1';
const COLORS=['#9fd8ff','#e06b6b','#5fbf8f','#6b9be0','#b07be0','#e09a5f','#5fc6d0','#9a9aa6'];
const DAYS=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const DAYS_L=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const MONTHS=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const bc='BroadcastChannel' in window?new BroadcastChannel(KEY):null;

let state=load();
let tab=0, selDate=iso(new Date()), q='';
let editBiz=null, editEv=null, editNote=null, pickColor=COLORS[0], noteColor='', notePinned=false;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function iso(d){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function parse(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.businesses)return s}catch(e){}
  return{businesses:[],active:null,events:{},notes:{}};
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){toast('Kaydedilemedi')}
  bc&&bc.postMessage('sync');
}
bc&&(bc.onmessage=()=>{state=load();render()});
window.addEventListener('storage',e=>{if(e.key===KEY){state=load();render()}});

function cur(){return state.businesses.find(b=>b.id===state.active)}
function evs(){return state.events[state.active]||(state.events[state.active]=[])}
function nts(){return state.notes[state.active]||(state.notes[state.active]=[])}

/* RENDER */
function render(){
  if(!cur()&&state.businesses.length)state.active=state.businesses[0].id;
  renderSide();renderTop();renderProgram();renderNotes();
}
function renderSide(){
  const el=document.getElementById('bizList');
  if(!state.businesses.length){el.innerHTML='<div style="color:var(--muted);font-size:13px;padding:12px">Henüz işletme yok.</div>';return}
  const today=iso(new Date());
  el.innerHTML=state.businesses.map(b=>{
    const n=(state.events[b.id]||[]).filter(e=>e.date===today&&!e.done).length;
    return `<button class="biz ${b.id===state.active?'active':''}" data-id="${b.id}" onclick="selBiz('${b.id}')" oncontextmenu="bizCtx(event,'${b.id}')">
      <span class="dot" style="background:${b.color}"></span><span class="nm">${esc(b.name)}</span>${n?`<span class="ct">${n}</span>`:''}</button>`;
  }).join('');
}
function renderTop(){
  const b=cur();
  document.getElementById('bizTitle').innerHTML=b?`<span class="dot" style="background:${b.color}"></span>${esc(b.name)}`:'Hoş geldin';
  document.getElementById('bizSub').textContent=b?`${evs().length} program · ${nts().length} not`:'Başlamak için bir işletme ekle';
  document.getElementById('editBizBtn').style.display=b?'':'none';
}
function renderProgram(){
  const v=document.getElementById('vProgram');
  if(!cur()){v.innerHTML=emptyStart();return}
  const d=parse(selDate), today=iso(new Date());
  const list=evs().filter(e=>e.date===selDate).sort((a,b)=>(a.start||'99').localeCompare(b.start||'99'));
  const done=list.filter(e=>e.done).length;
  // hafta (Pzt başlangıç)
  const ws=new Date(d);ws.setDate(d.getDate()-((d.getDay()+6)%7));
  let week='';
  for(let i=0;i<7;i++){
    const x=new Date(ws);x.setDate(ws.getDate()+i);const s=iso(x);
    const c=Math.min(evs().filter(e=>e.date===s).length,4);
    week+=`<button class="wd ${s===today?'today':''} ${s===selDate?'sel':''}" onclick="goDate('${s}')">
      <div class="a">${DAYS[x.getDay()]}</div><div class="b">${x.getDate()}</div><div class="c">${'<i></i>'.repeat(c)}</div></button>`;
  }
  const rel=selDate===today?'Bugün':(()=>{const t=new Date();t.setHours(0,0,0,0);const df=Math.round((d-t)/864e5);return df===1?'Yarın':df===-1?'Dün':''})();
  // sağ panel
  const nowT=(()=>{const n=new Date();return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')})();
  const pending=list.filter(e=>!e.done);
  const nxt=selDate===today?pending.find(e=>e.start&&e.start>=nowT)||pending[0]:pending[0];
  const upcoming=evs().filter(e=>e.date>selDate&&!e.done).sort((a,b)=>(a.date+(a.start||'99')).localeCompare(b.date+(b.start||'99'))).slice(0,6);
  const pins=nts().filter(n=>n.pinned).slice(0,4);
  const aside=`
    <div class="box"><h5>Gün Özeti</h5>
      <div class="stats">
        <div class="stat"><b>${list.length}</b><span>Toplam</span></div>
        <div class="stat o"><b>${done}</b><span>Biten</span></div>
        <div class="stat g"><b>${list.length-done}</b><span>Kalan</span></div>
      </div>
      <div class="next">${nxt?`Sıradaki<b><em>${nxt.start||'—'}</em>${esc(nxt.title)}</b>`:list.length?'Tüm işler tamamlandı':'Bu gün için iş yok'}</div>
    </div>
    <div class="box"><h5>Yaklaşanlar</h5>
      ${upcoming.length?`<div class="up">${upcoming.map(e=>{const x=parse(e.date);return `<button class="up-r" onclick="goDate('${e.date}')"><span class="ud">${x.getDate()} ${MONTHS[x.getMonth()].slice(0,3)}</span><span class="ut">${esc(e.title)}${e.start?`<small>${e.start}</small>`:''}</span></button>`}).join('')}</div>`:'<div class="muted">Yaklaşan iş yok.</div>'}
    </div>
    ${pins.length?`<div class="box"><h5>Sabit Notlar</h5>${pins.map(n=>`<div class="pn" style="${n.color?'--nc:'+n.color:''}" onclick="openNote('${n.id}')">${esc(n.title||n.body||'Başlıksız')}</div>`).join('')}</div>`:''}`;
  v.innerHTML=`<div class="pgrid"><div class="pmain">
    <div class="datebar">
      <button class="icon-btn" onclick="shift(-1)" aria-label="Önceki gün"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="d">${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}<span>${DAYS_L[d.getDay()]}${rel?' · '+rel:''}</span></div>
      <button class="icon-btn" onclick="shift(1)" aria-label="Sonraki gün"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
      <div class="sp"></div>
      ${selDate!==today?`<button class="btn btn-ghost btn-sm" onclick="goDate('${today}')">Bugün</button>`:''}
      ${list.some(e=>!e.done)?`<button class="btn btn-ghost btn-sm" onclick="carryOver()">Bitmeyenleri yarına taşı</button>`:''}
    </div>
    <div class="week">${week}</div>
    ${list.length?`<div class="progress"><span>${done}/${list.length} tamamlandı</span><div class="bar"><i style="width:${list.length?done/list.length*100:0}%"></i></div></div>`:''}
    <div class="items">${list.length?list.map(itemHTML).join(''):`<div class="empty"><b>Bu gün için program yok</b>Sağ üstten ya da + ile ekleyebilirsin.</div>`}</div>
    </div><aside class="paside">${aside}</aside></div>`;
}
function itemHTML(e){
  return `<div class="item ${e.done?'done':''}">
    <button class="chk ${e.done?'on':''}" onclick="toggleDone('${e.id}')" aria-label="Tamamlandı"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0a0a0b" stroke-width="3.5"><path d="M5 12l5 5L20 7"/></svg></button>
    <div class="it-time">${e.start||'—'}${e.end?`<small>${e.end}</small>`:''}</div>
    <div><div class="it-t">${esc(e.title)}</div>${e.note?`<div class="it-n">${esc(e.note)}</div>`:''}${e.tag?`<span class="tag">${esc(e.tag)}</span>`:''}</div>
    <div class="it-act">
      <button class="mini" onclick="dupEv('${e.id}')" title="Yarına kopyala"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg></button>
      <button class="mini" onclick="openEv('${e.id}')" title="Düzenle"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
      <button class="mini del" onclick="quickDel('${e.id}')" title="Sil"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
    </div></div>`;
}
function renderNotes(){
  const v=document.getElementById('vNotes');
  if(!cur()){v.innerHTML=emptyStart();return}
  const ql=q.toLocaleLowerCase('tr');
  const list=nts().filter(n=>!ql||(n.title+' '+n.body).toLocaleLowerCase('tr').includes(ql)).sort((a,b)=>b.updated-a.updated);
  const pin=list.filter(n=>n.pinned), rest=list.filter(n=>!n.pinned);
  const card=n=>`<div class="note" style="${n.color?'--nc:'+n.color:''}" onclick="openNote('${n.id}')">
    ${n.pinned?'<svg class="pin" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M16 3l5 5-3 1-4 4 1 5-2 2-4-4-5 5-1-1 5-5-4-4 2-2 5 1 4-4z"/></svg>':''}
    <h4>${esc(n.title||'Başlıksız')}</h4>${n.body?`<p>${esc(n.body)}</p>`:''}<div class="meta">${fmtTime(n.updated)}</div></div>`;
  v.innerHTML=`
    <div class="notebar"><input id="qIn" placeholder="Notlarda ara…" value="${esc(q)}" oninput="q=this.value;renderNotes();const i=document.getElementById('qIn');i.focus();i.setSelectionRange(i.value.length,i.value.length)"></div>
    ${!list.length?`<div class="empty"><b>${q?'Sonuç yok':'Henüz not yok'}</b>${q?'Farklı bir kelime dene.':'Fikirler, müşteri istekleri, şifre ipuçları… ne istersen.'}</div>`:''}
    ${pin.length?`<div class="sec-t">Sabitlenenler</div><div class="notes">${pin.map(card).join('')}</div>`:''}
    ${rest.length?`${pin.length?'<div class="sec-t" style="margin-top:10px">Diğer</div>':''}<div class="notes">${rest.map(card).join('')}</div>`:''}`;
}
function emptyStart(){return `<div class="empty" style="margin-top:20px"><b>İlk işletmeni ekle</b>Her işletmenin programı ve notları ayrı tutulur.<br><br><button class="btn btn-gold" onclick="openBiz()">+ İşletme Ekle</button></div>`}
function fmtTime(t){const d=new Date(t);return `${d.getDate()} ${MONTHS[d.getMonth()]} · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}

/* NAV */
function setTab(i){
  tab=i;
  document.getElementById('slider').style.transform=`translateX(${-i*50}%)`;
  const btns=document.querySelectorAll('#tabs button');
  btns.forEach((b,j)=>b.classList.toggle('on',j===i));
  const p=document.getElementById('pill'),b=btns[i];
  p.style.left=b.offsetLeft+'px';p.style.width=b.offsetWidth+'px';
}
function selBiz(id){state.active=id;save();render();toggleSide(false)}
function goDate(s){selDate=s;renderProgram()}
function shift(n){const d=parse(selDate);d.setDate(d.getDate()+n);goDate(iso(d))}
function toggleSide(o){document.getElementById('side').classList.toggle('open',o);document.getElementById('scrim').classList.toggle('show',o)}
function addCurrent(){if(!cur())return openBiz();tab===0?openEv():openNote()}

/* MODALS */
function openM(id){document.getElementById(id).classList.add('show')}
function closeM(id){document.getElementById(id).classList.remove('show')}
document.querySelectorAll('.ov').forEach(o=>o.addEventListener('mousedown',e=>{if(e.target===o)closeM(o.id)}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.ov.show').forEach(o=>closeM(o.id))});
function colorPicker(elId,val,cb,allowNone){
  const el=document.getElementById(elId);
  const list=allowNone?['',...COLORS]:COLORS;
  const custom=val&&!list.includes(val);
  el.innerHTML=list.map(c=>`<button type="button" class="${c===val?'on':''}" style="background:${c||'var(--line)'}" data-c="${c}" title="${c||'Renksiz'}"></button>`).join('')+
    `<label class="cpick ${custom?'on':''}" title="Özel renk" style="${custom?'--cv:'+val:''}"><input type="color" value="${val||'#9fd8ff'}"></label>
     <input class="chex" maxlength="7" placeholder="#RRGGBB" value="${val||''}" spellcheck="false">`;
  const pick=el.querySelector('.cpick'),ci=pick.querySelector('input'),hx=el.querySelector('.chex');
  const mark=(v,fromList)=>{
    el.querySelectorAll('button').forEach(x=>x.classList.toggle('on',fromList&&x.dataset.c===v));
    pick.classList.toggle('on',!fromList);
    if(!fromList)pick.style.setProperty('--cv',v);else pick.style.removeProperty('--cv');
  };
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{const v=b.dataset.c;cb(v);hx.value=v;if(v)ci.value=v;mark(v,true)});
  ci.oninput=()=>{const v=ci.value;cb(v);hx.value=v;mark(v,list.includes(v))};
  hx.oninput=()=>{let v=hx.value.trim();if(v&&v[0]!=='#')v='#'+v;
    if(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v)){if(v.length===4)v='#'+[...v.slice(1)].map(c=>c+c).join('');v=v.toLowerCase();cb(v);ci.value=v;mark(v,list.includes(v));hx.classList.remove('bad')}
    else hx.classList.toggle('bad',!!v)};
}

/* BUSINESS */
function openBiz(id){
  editBiz=id||null;const b=id&&state.businesses.find(x=>x.id===id);
  document.getElementById('mBizT').textContent=b?'İşletmeyi Düzenle':'Yeni İşletme';
  document.getElementById('bName').value=b?b.name:'';
  pickColor=b?b.color:COLORS[state.businesses.length%COLORS.length];
  colorPicker('bColors',pickColor,c=>pickColor=c);
  document.getElementById('bDel').style.display=b?'':'none';
  openM('mBiz');setTimeout(()=>document.getElementById('bName').focus(),50);
}
function saveBiz(){
  const name=document.getElementById('bName').value.trim();if(!name)return toast('İsim gir');
  if(editBiz){Object.assign(state.businesses.find(b=>b.id===editBiz),{name,color:pickColor})}
  else{const id=uid();state.businesses.push({id,name,color:pickColor});state.active=id}
  save();closeM('mBiz');render();
}
function delBiz(){
  const id=editBiz,b=state.businesses.find(x=>x.id===id);
  ask(`"${b.name}" ve tüm programı/notları silinsin mi?`,()=>{
    state.businesses=state.businesses.filter(x=>x.id!==id);
    delete state.events[id];delete state.notes[id];
    state.active=state.businesses[0]?.id||null;save();closeM('mBiz');render();toast('İşletme silindi')});
}

/* EVENTS */
function openEv(id){
  editEv=id||null;const e=id&&evs().find(x=>x.id===id);
  document.getElementById('mEvT').textContent=e?'Programı Düzenle':'Programa Ekle';
  eTitle.value=e?e.title:'';eStart.value=e?e.start:'';eEnd.value=e?e.end:'';
  eDate.value=e?e.date:selDate;eTag.value=e?e.tag:'';eNote.value=e?e.note:'';
  document.getElementById('eDel').style.display=e?'':'none';
  openM('mEv');setTimeout(()=>eTitle.focus(),50);
}
function saveEv(){
  const title=eTitle.value.trim();if(!title)return toast('Başlık gir');
  const data={title,start:eStart.value,end:eEnd.value,date:eDate.value||selDate,tag:eTag.value,note:eNote.value.trim()};
  if(editEv)Object.assign(evs().find(e=>e.id===editEv),data);
  else evs().push({id:uid(),done:false,...data});
  save();closeM('mEv');selDate=data.date;render();
}
function delEv(){const id=editEv;ask('Bu iş silinsin mi?',()=>{state.events[state.active]=evs().filter(e=>e.id!==id);save();closeM('mEv');render();toast('Silindi')})}
function quickDel(id){ask('Bu iş silinsin mi?',()=>{state.events[state.active]=evs().filter(e=>e.id!==id);save();render();toast('Silindi')})}
function toggleDone(id){const e=evs().find(x=>x.id===id);e.done=!e.done;save();render()}
function nextDay(s){const d=parse(s);d.setDate(d.getDate()+1);return iso(d)}
function dupEv(id){const e=evs().find(x=>x.id===id);evs().push({...e,id:uid(),done:false,date:nextDay(e.date)});save();render();toast('Yarına kopyalandı')}
function carryOver(){
  const nd=nextDay(selDate);let n=0;
  evs().forEach(e=>{if(e.date===selDate&&!e.done){e.date=nd;n++}});
  save();render();toast(`${n} iş yarına taşındı`);
}
document.getElementById('mEv').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA')saveEv()});
document.getElementById('mBiz').addEventListener('keydown',e=>{if(e.key==='Enter')saveBiz()});

/* NOTES */
function openNote(id){
  editNote=id||null;const n=id&&nts().find(x=>x.id===id);
  nTitle.value=n?n.title:'';nBody.value=n?n.body:'';
  noteColor=n?n.color||'':'';notePinned=n?!!n.pinned:false;
  colorPicker('nColors',noteColor,c=>noteColor=c,true);
  document.getElementById('nPin').textContent=notePinned?'Sabitlemeyi kaldır':'Sabitle';
  document.getElementById('nDel').style.display=n?'':'none';
  openM('mNote');setTimeout(()=>(n?nBody:nTitle).focus(),50);
}
function togglePinM(){notePinned=!notePinned;document.getElementById('nPin').textContent=notePinned?'Sabitlemeyi kaldır':'Sabitle'}
function saveNote(){
  const title=nTitle.value.trim(),body=nBody.value.trim();
  if(!title&&!body){closeM('mNote');return}
  const data={title,body,color:noteColor,pinned:notePinned,updated:Date.now()};
  if(editNote)Object.assign(nts().find(n=>n.id===editNote),data);
  else nts().push({id:uid(),...data});
  save();closeM('mNote');render();
}
function delNote(){const id=editNote;ask('Not silinsin mi?',()=>{state.notes[state.active]=nts().filter(n=>n.id!==id);save();closeM('mNote');render();toast('Not silindi')})}
document.getElementById('mNote').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))saveNote()});

/* BACKUP */
function exportData(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));
  a.download=`isletme-paneli-${iso(new Date())}.json`;a.click();toast('Yedek indirildi');
}
function importData(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.businesses)throw 0;
    ask('Mevcut veriler bu yedekle değiştirilsin mi?',()=>{state=d;save();render();toast('Yedek yüklendi')},'Değiştir')}catch(e){toast('Geçersiz dosya')}inp.value=''};
  r.readAsText(f);
}
function ask(msg,yes,label){
  document.getElementById('cMsg').textContent=msg;
  const b=document.getElementById('cYes');b.textContent=label||'Sil';
  b.onclick=()=>{closeM('mConf');yes()};
  openM('mConf');setTimeout(()=>b.focus(),50);
}
/* SAĞ TIK MENÜSÜ */
let ctxId=null,lpT=null,lpFired=false;
function bizCtx(e,id,x,y){
  e.preventDefault();ctxId=id;
  const m=document.getElementById('ctx'),b=state.businesses.find(v=>v.id===id);
  document.getElementById('ctxName').innerHTML=`<span class="dot" style="background:${b.color}"></span>${esc(b.name)}`;
  m.classList.add('show');
  const px=x??e.clientX,py=y??e.clientY,w=m.offsetWidth,h=m.offsetHeight;
  m.style.left=Math.min(px,innerWidth-w-8)+'px';m.style.top=Math.min(py,innerHeight-h-8)+'px';
}
function ctxClose(){document.getElementById('ctx').classList.remove('show')}
function ctxDo(a){
  const id=ctxId;ctxClose();if(!id)return;
  if(a==='open')selBiz(id);
  else if(a==='edit')openBiz(id);
  else if(a==='del'){editBiz=id;delBiz()}
}
document.addEventListener('mousedown',e=>{if(!e.target.closest('#ctx'))ctxClose()});
document.addEventListener('scroll',ctxClose,true);
window.addEventListener('blur',ctxClose);
document.addEventListener('keydown',e=>{if(e.key==='Escape')ctxClose()});
// mobilde uzun basma
const bl=document.getElementById('bizList');
bl.addEventListener('touchstart',e=>{const b=e.target.closest('.biz');if(!b)return;lpFired=false;const t=e.touches[0];
  lpT=setTimeout(()=>{lpFired=true;bizCtx({preventDefault(){}},b.dataset.id,t.clientX,t.clientY)},500)},{passive:true});
['touchend','touchmove','touchcancel'].forEach(ev=>bl.addEventListener(ev,()=>clearTimeout(lpT),{passive:true}));
bl.addEventListener('click',e=>{if(lpFired){e.stopPropagation();e.preventDefault();lpFired=false}},true);

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2000)}

window.addEventListener('resize',()=>setTab(tab));
render();
requestAnimationFrame(()=>setTab(0));
document.fonts&&document.fonts.ready.then(()=>setTab(tab));
</script>
